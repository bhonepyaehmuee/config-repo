server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false      # Prevents the fake "UP" status emergency
    eviction-interval-timer-in-ms: 2000 # Actively clears dead services every 2 seconds