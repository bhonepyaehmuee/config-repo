server:
  port: 8080                    # The main entry point port for your entire application

spring:
  application:
    name: api-gateway           # The name this gateway will use to register in Eureka

  cloud:
    gateway:
      # OPTION 1: AUTOMATIC ROUTING VIA EUREKA
      discovery:
        locator:
          enabled: true
          lower-case-service-name: true  # Allows http://localhost:8080/product-service/path

      # OPTION 2: CUSTOM EXPLICIT ROUTING
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE         # Load-balances using Eureka's registry
          predicates:
            - Path=/test-config, /test-config/** # Routes any request starting with /test-config/

        - id: category-service
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/message, /message/**
        - id: actuator
          uri: forward:/actuator
          predicates:
            - Path=/actuator/** # Routes any request starting with /message/

# EUREKA CLIENT CONFIGURATION
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # The address of your running Eureka Server
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ACTUATOR MONITORING ENDPOINTS
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# FIXED: Moved to the root level and added dummy metadata so the endpoint isn't empty!
info:
  app:
    name: "API Gateway"
    description: "Spring Cloud Gateway MVC"
    version: "1.0.0"