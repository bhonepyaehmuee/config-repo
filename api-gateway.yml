server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      # ===== EUREKA AUTO ROUTING =====
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # ===== CUSTOM ROUTES =====
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/test-config/**

        - id: category-service
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/message/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: API Gateway
    description: Spring Cloud Gateway
    version: 1.0.0